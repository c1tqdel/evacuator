<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Эвакуатор Премиум - DEMO</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Rubik:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="bg-grid"></div>

    <div class="demo-drifter">DEMO</div>
    <div class="demo-drifter drifter-2">SITE</div>

    <main class="main-wrapper">
      <header class="header-block">
        <h1 class="pro-title">
          ПОМОЩЬ <br />НА ДОРОГЕ <span class="gold-text">24/7</span>
        </h1>
        <p class="pro-subtitle">Казань и область • Быстрая подача</p>
      </header>

      <section class="action-block">
        <a href="tel:+79000000000" class="premium-btn">
          <span class="btn-ripple"></span>
          <span class="btn-text">📞 ВЫЗВАТЬ</span>
        </a>
        <p class="phone-num">+7 (900) 000-00-00</p>
      </section>

      <section class="info-grid">
        <div class="info-card">
          <div class="card-icon">⚡️</div>
          <div class="card-data">
            <span class="val">15-30 мин</span>
            <span class="desc">подача</span>
          </div>
        </div>
        <div class="info-card">
          <div class="card-icon">💎</div>
          <div class="card-data">
            <span class="val">от 1500₽</span>
            <span class="desc">честная цена</span>
          </div>
        </div>
        <div class="info-card">
          <div class="card-icon">🚛</div>
          <div class="card-data">
            <span class="val">Любые авто</span>
            <span class="desc">до 5 тонн</span>
          </div>
        </div>
        <div class="info-card">
          <div class="card-icon">💳</div>
          <div class="card-data">
            <span class="val">QR / Карта</span>
            <span class="desc">оплата</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
